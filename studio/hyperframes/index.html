<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #272727;
      }
      #root {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      }
      .bar {
        position: absolute;
        width: 250px;
        height: 30px;
        border-radius: 25px;
        background: #fff;
        box-shadow: 0 10px 25px rgba(255, 101, 47, 0.2);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="4"
      data-width="1920"
      data-height="1080"
    >
      <div id="top" class="bar clip" data-start="0" data-duration="4" data-track-index="0"></div>
      <div id="mid" class="bar clip" data-start="0" data-duration="4" data-track-index="1"></div>
      <div id="bot" class="bar clip" data-start="0" data-duration="4" data-track-index="2"></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      // Same open/close as the CSS hamburger button, scaled up for video.
      tl.set("#top", { y: -80 }, 0).set("#bot", { y: 80 }, 0);
      tl.to("#mid", { x: -250, opacity: 0, duration: 0.6, ease: "power2.inOut" }, 0.6)
        .to("#top", { y: 0, rotation: 45, duration: 0.6, ease: "back.out(1.6)" }, 0.6)
        .to("#bot", { y: 0, rotation: -45, duration: 0.6, ease: "back.out(1.6)" }, 0.6)
        .to("#mid", { x: 0, opacity: 1, duration: 0.6, ease: "power2.inOut" }, 2.2)
        .to("#top", { y: -80, rotation: 0, duration: 0.6, ease: "power2.inOut" }, 2.2)
        .to("#bot", { y: 80, rotation: 0, duration: 0.6, ease: "power2.inOut" }, 2.2);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
