<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskFlow — GHL Task Management</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>

<div id="app">

  <!-- Loading screen -->
  <div id="loading" class="loading-screen">
    <div class="loading-logo">
      <svg width="48" height="48" viewBox="0 0 48 48" fill="none">
        <rect width="48" height="48" rx="12" fill="#6366f1"/>
        <path d="M14 24h20M24 14v20" stroke="#fff" stroke-width="3.5" stroke-linecap="round"/>
      </svg>
      <span>TaskFlow</span>
    </div>
    <div class="spinner"></div>
  </div>

  <!-- Login screen -->
  <div id="auth-screen" class="hidden">
    <div class="auth-card">
      <div class="auth-logo">
        <svg width="52" height="52" viewBox="0 0 48 48" fill="none">
          <rect width="48" height="48" rx="12" fill="#6366f1"/>
          <path d="M14 24h20M24 14v20" stroke="#fff" stroke-width="3.5" stroke-linecap="round"/>
        </svg>
        <h1>TaskFlow</h1>
        <p>Manage tasks across all your GHL sub-accounts</p>
      </div>
      <a href="/auth/login" class="btn btn-ghl">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
          <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z" fill="currentColor"/>
        </svg>
        Connect with Go High Level
      </a>
      <div id="auth-error" class="auth-error hidden"></div>
      <p class="auth-note">Your GHL credentials are never stored — only an OAuth token.</p>
    </div>
  </div>

  <!-- Main app -->
  <div id="main-app" class="hidden">
    <aside id="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-logo">
          <svg width="28" height="28" viewBox="0 0 48 48" fill="none">
            <rect width="48" height="48" rx="10" fill="#6366f1"/>
            <path d="M14 24h20M24 14v20" stroke="#fff" stroke-width="3.5" stroke-linecap="round"/>
          </svg>
          <span class="sidebar-brand">TaskFlow</span>
        </div>
        <button id="sidebar-toggle" class="icon-btn" title="Collapse sidebar">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M15 18l-6-6 6-6"/>
          </svg>
        </button>
      </div>

      <div class="sidebar-account">
        <div class="account-badge" id="account-badge">
          <span class="account-avatar" id="account-avatar">A</span>
          <div class="account-info">
            <span id="account-name" class="account-name">Loading…</span>
            <span id="account-type" class="account-type">agency</span>
          </div>
        </div>
      </div>

      <nav class="sidebar-nav">
        <div class="nav-section">
          <span class="nav-label">Menu</span>
          <a class="nav-item" data-view="dashboard" href="#dashboard">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
            Dashboard
          </a>
          <a class="nav-item" data-view="all-tasks" href="#all-tasks">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>
            All Tasks
          </a>
          <a class="nav-item" data-view="settings" href="#settings">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
            Settings
          </a>
        </div>

        <div class="nav-section">
          <span class="nav-label">
            Workspaces
            <button class="nav-add-btn" id="new-workspace-btn" title="New workspace">+</button>
          </span>
          <div id="workspace-list"></div>
        </div>
      </nav>

      <div class="sidebar-footer">
        <button class="nav-item logout-btn" id="logout-btn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          Sign out
        </button>
      </div>
    </aside>

    <div id="content">
      <header id="topbar">
        <div class="topbar-left">
          <h2 id="page-title">Dashboard</h2>
        </div>
        <div class="topbar-right">
          <div id="agency-filter" class="agency-filter hidden">
            <label>Sub-account:</label>
            <select id="location-filter">
              <option value="">All sub-accounts</option>
            </select>
          </div>
          <div id="user-filter" class="user-filter hidden">
            <label>Assigned to:</label>
            <select id="assignee-filter">
              <option value="">Everyone</option>
            </select>
          </div>
        </div>
      </header>
      <main id="view"></main>
    </div>
  </div>
</div>

<!-- Modal overlay -->
<div id="modal-overlay" class="hidden">
  <div id="modal-box"></div>
</div>

<!-- Toast container -->
<div id="toast-container"></div>

<script type="module" src="/js/app.js"></script>
</body>
</html>
